<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <meta name="description" content="Kalendar Malaysia 2027 interaktif dengan mod gelap/terang, navigasi bulan, dan zum gambar penuh." />
  <title>Kalendar Malaysia 2027 • Dark/Light + Zum</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #0f0f11;
      --card: #16161a;
      --text: #e0e0e5;
      --text-light: #a0a0b0;
      --accent: #7c6eff;
      --accent-dark: #5e50d0;
      --border: #2a2a35;
      --nav-bg: #141418e8;
      --shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
      --transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    [data-theme="light"] {
      --bg: #f4f4f9;
      --card: #ffffff;
      --text: #1c1c1f;
      --text-light: #6e6e73;
      --accent: #5e5ce6;
      --accent-dark: #4a47c0;
      --border: #d9d9e3;
      --nav-bg: #fffffff2;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
      min-height: 100vh;
      transition: background 0.35s ease, color 0.3s ease;
    }

    header {
      text-align: center;
      padding: 36px 20px 28px;
      position: relative;
    }

    h1 {
      font-size: 2.6rem;
      font-weight: 700;
      background: linear-gradient(130deg, var(--accent) 0%, #b084ff 100%);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: -0.3px;
    }

    .title-emoji {
      background: none;
      -webkit-background-clip: initial;
      background-clip: initial;
      color: initial;
      -webkit-text-fill-color: initial;
    }

    .theme-toggle {
      position: absolute;
      top: 28px;
      right: 28px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--accent);
      width: 50px;
      height: 50px;
      border-radius: 60px;
      font-size: 1.6rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      transition: 0.2s;
      z-index: 100;
      backdrop-filter: blur(4px);
    }

    .theme-toggle:hover {
      transform: scale(1.05);
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .nav-container {
      background: var(--nav-bg);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 99;
      padding: 12px 0;
      transition: background 0.2s;
    }

    .month-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 14px;
      max-width: 1300px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .month-btn {
      background: var(--card);
      color: var(--accent);
      border: 1px solid var(--border);
      padding: 8px 18px;
      border-radius: 60px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
      position: relative;
    }

    .month-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      box-shadow: 0 4px 14px rgba(108, 92, 231, 0.4);
    }

    .month-btn:hover {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 5px 12px rgba(108, 92, 231, 0.3);
    }

    .container {
      max-width: 1380px;
      margin: 0 auto;
      padding: 48px 24px 90px;
    }

    .year-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 36px 30px;
    }

    .month-card {
      background: var(--card);
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid var(--border);
      transition: transform 0.3s, box-shadow 0.3s;
      box-shadow: var(--shadow);
      cursor: pointer;
      position: relative;
    }

    .month-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(108, 92, 231, 0.15) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 1;
    }

    .month-card:hover::before {
      opacity: 1;
    }

    .month-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 25px 40px rgba(0, 0, 0, 0.3);
    }

    .month-card.highlight {
      box-shadow: 0 0 0 3px var(--accent), 0 15px 30px rgba(0,0,0,0.3);
    }

    .month-title {
      padding: 20px 16px;
      text-align: center;
      font-size: 1.45rem;
      font-weight: 700;
      background: linear-gradient(120deg, rgba(108, 92, 231, 0.08), rgba(108, 92, 231, 0.02));
      border-bottom: 1px solid var(--border);
      color: var(--accent);
      letter-spacing: -0.2px;
      position: relative;
      z-index: 2;
    }

    .month-image-wrap {
      position: relative;
      width: 100%;
      background: #f9f9fc;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .month-image {
      width: 100%;
      height: auto;
      display: block;
      transition: filter 0.2s, opacity 0.4s ease;
      position: relative;
      z-index: 2;
      opacity: 0;
    }

    .month-image.loaded {
      opacity: 1;
    }

    .month-image-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card);
      color: var(--text-light);
      font-size: 0.85rem;
      font-weight: 500;
      gap: 8px;
      z-index: 3;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2.5px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .month-image-placeholder.hidden {
      display: none;
    }

    /* MODAL LIGHTBOX */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.94);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
    }

    .modal.active {
      display: flex;
    }

    .modal-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .modal-img-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    #modalImage {
      max-width: 92vw;
      max-height: 88vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
      transition: transform 0.2s ease-out, opacity 0.25s ease;
      cursor: default;
      user-select: none;
      -webkit-user-drag: none;
    }

    #modalImage.zoomed {
      cursor: grab;
    }

    #modalImage.zoomed:active {
      cursor: grabbing;
    }

    .close-btn {
      position: absolute;
      top: 28px;
      right: 32px;
      font-size: 3rem;
      font-weight: 300;
      color: white;
      background: rgba(20, 20, 28, 0.7);
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
      z-index: 10010;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.2);
      font-family: monospace;
    }

    .close-btn:hover {
      background: #ff3b30;
      transform: rotate(90deg);
    }

    .modal-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 2rem;
      color: white;
      background: rgba(20, 20, 28, 0.6);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
      z-index: 10010;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.15);
      font-family: monospace;
      user-select: none;
    }

    .modal-nav-btn:hover {
      background: rgba(108, 92, 231, 0.8);
    }

    .modal-nav-btn.disabled {
      opacity: 0.2;
      pointer-events: none;
    }

    .modal-nav-btn.prev { left: 16px; }
    .modal-nav-btn.next { right: 16px; }

    .modal-top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 80px;
      z-index: 10010;
      pointer-events: none;
    }

    .modal-month-label {
      color: white;
      font-size: 0.9rem;
      font-weight: 600;
      background: rgba(0,0,0,0.5);
      padding: 6px 18px;
      border-radius: 60px;
      backdrop-filter: blur(10px);
      white-space: nowrap;
      pointer-events: auto;
    }

    .share-btn {
      position: absolute;
      top: 28px;
      right: 100px;
      font-size: 1.4rem;
      color: white;
      background: rgba(20, 20, 28, 0.7);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
      z-index: 10010;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.2);
      font-family: monospace;
    }

    .share-btn:hover {
      background: var(--accent);
    }

    .zoom-hint {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 8px 20px;
      border-radius: 60px;
      font-size: 0.8rem;
      backdrop-filter: blur(10px);
      pointer-events: none;
      z-index: 10010;
      white-space: nowrap;
      font-weight: 500;
    }

    .modal-loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
      z-index: 10005;
    }

    .modal-loader.hidden {
      display: none;
    }

    .modal-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #b084ff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    /* LONG PRESS TOAST */
    .longpress-toast {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 10px 24px;
      border-radius: 60px;
      font-size: 0.85rem;
      font-weight: 500;
      backdrop-filter: blur(12px);
      z-index: 10011;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .longpress-toast.show {
      opacity: 1;
    }

    /* SCROLL TO TOP BUTTON */
    .scroll-top-btn {
      position: fixed;
      bottom: 28px;
      right: 28px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(108, 92, 231, 0.5);
      z-index: 98;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
    }

    .scroll-top-btn.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .scroll-top-btn:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 8px 25px rgba(108, 92, 231, 0.6);
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 40px 20px;
      border-top: 1px solid var(--border);
      color: var(--text-light);
      font-size: 0.85rem;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* screen reader only */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 1100px) {
      .year-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 680px) {
      .month-nav { gap: 8px; }
      .month-btn { padding: 6px 14px; font-size: 0.8rem; }
      .year-grid { grid-template-columns: 1fr; gap: 24px; }
      h1 { font-size: 2rem; }
      .theme-toggle { width: 44px; height: 44px; top: 20px; right: 20px; font-size: 1.3rem; }
      .close-btn { width: 44px; height: 44px; font-size: 2rem; top: 16px; right: 18px; }
      .share-btn { width: 40px; height: 40px; top: 18px; right: 70px; font-size: 1.2rem; }
      .modal-nav-btn { width: 40px; height: 40px; font-size: 1.5rem; }
      .modal-nav-btn.prev { left: 8px; }
      .modal-nav-btn.next { right: 8px; }
      .modal-month-label { font-size: 0.8rem; padding: 4px 14px; }
      .modal-top-bar { padding: 16px 60px; }
      .zoom-hint { font-size: 0.7rem; bottom: 12px; white-space: nowrap; }
      .scroll-top-btn { width: 44px; height: 44px; bottom: 20px; right: 20px; font-size: 1.3rem; }
    }
  </style>
</head>
<body data-theme="dark">

  <button class="theme-toggle" id="themeBtn" aria-label="Tukar tema gelap/terang">☀️</button>

  <header>
    <h1><span class="title-emoji">🗓️</span> Kalendar Malaysia 2027</h1>
  </header>

  <div class="nav-container">
    <div class="month-nav" id="monthNav" role="navigation" aria-label="Navigasi bulan">
      <button class="month-btn" data-month="jan" aria-label="January 2027">Jan</button>
      <button class="month-btn" data-month="feb" aria-label="February 2027">Feb</button>
      <button class="month-btn" data-month="mac" aria-label="March 2027">Mac</button>
      <button class="month-btn" data-month="apr" aria-label="April 2027">Apr</button>
      <button class="month-btn" data-month="mei" aria-label="May 2027">Mei</button>
      <button class="month-btn" data-month="jun" aria-label="June 2027">Jun</button>
      <button class="month-btn" data-month="jul" aria-label="July 2027">Jul</button>
      <button class="month-btn" data-month="ogo" aria-label="August 2027">Ogo</button>
      <button class="month-btn" data-month="sep" aria-label="September 2027">Sep</button>
      <button class="month-btn" data-month="okt" aria-label="October 2027">Okt</button>
      <button class="month-btn" data-month="nov" aria-label="November 2027">Nov</button>
      <button class="month-btn" data-month="dis" aria-label="December 2027">Dis</button>
    </div>
  </div>

  <div class="container">
    <div class="year-grid" id="calendarGrid" role="main" aria-label="Kalendar Malaysia 2027">
    </div>
  </div>

  <footer>
    Kalendar Malaysia 2027 &mdash; By Zahir
  </footer>

  <!-- Scroll to Top -->
  <button class="scroll-top-btn" id="scrollTopBtn" aria-label="Scroll ke atas">↑</button>

  <!-- Lightbox Modal -->
  <div class="modal" id="imageModal" role="dialog" aria-label="Gambar kalendar penuh" aria-modal="true">
    <span class="close-btn" id="closeModal" aria-label="Tutup gambar" tabindex="0">✕</span>
    <button class="share-btn" id="shareBtn" aria-label="Kongsi gambar">↗</button>
    <span class="modal-nav-btn prev" id="modalPrev" aria-label="Bulan sebelumnya">‹</span>
    <span class="modal-nav-btn next" id="modalNext" aria-label="Bulan seterusnya">›</span>
    <div class="modal-top-bar">
      <div class="modal-month-label" id="modalMonthLabel"></div>
    </div>
    <div class="modal-container" id="modalContainer">
      <div class="modal-img-wrapper">
        <div class="modal-loader" id="modalLoader">
          <div class="modal-spinner"></div>
          <span>Memuatkan gambar...</span>
        </div>
        <img id="modalImage" src="" alt="Kalendar Malaysia 2027 - Bulan" draggable="false">
      </div>
    </div>
    <div class="longpress-toast" id="longpressToast">💾 Memuatkan untuk muat turun...</div>
    <div class="zoom-hint" id="zoomHint">🔍 Pinch / Ctrl + roda tetikus untuk zum | Tarik untuk pan</div>
  </div>

  <div id="liveRegion" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <script>
    const monthsData = [
      { id: "jan", name: "January 2027", img: "https://raw.githubusercontent.com/zahiruddin0/HTML-3/refs/heads/main/MALAYSIA%20CALENDER%202027/January-2027-Calendar.jpg" },
      { id: "feb", name: "February 2027", img: "https://raw.githubusercontent.com/zahiruddin0/HTML-3/refs/heads/main/MALAYSIA%20CALENDER%202027/February-2027-Calendar.jpg" },
      { id: "mac", name: "March 2027", img: "https://raw.githubusercontent.com/zahiruddin0/HTML-3/refs/heads/main/MALAYSIA%20CALENDER%202027/March-2027-Calendar.jpg" },
      { id: "apr", name: "April 2027", img: "https://raw.githubusercontent.com/zahiruddin0/HTML-3/refs/heads/main/MALAYSIA%20CALENDER%202027/April-2027-Calendar.jpg" },
      { id: "mei", name: "May 2027", img: "https://raw.githubusercontent.com/zahiruddin0/HTML-3/refs/heads/main/MALAYSIA%20CALENDER%202027/May-2027-Calendar.jpg" },
      { id: "jun", name: "June 2027", img: "https://raw.githubusercontent.com/zahiruddin0/HTML-3/refs/heads/main/MALAYSIA%20CALENDER%202027/June-2027-Calendar.jpg" },
      { id: "jul", name: "July 2027", img: "https://raw.githubusercontent.com/zahiruddin0/HTML-3/refs/heads/main/MALAYSIA%20CALENDER%202027/July-2027-Calendar.jpg" },
      { id: "ogo", name: "August 2027", img: "https://raw.githubusercontent.com/zahiruddin0/HTML-3/refs/heads/main/MALAYSIA%20CALENDER%202027/August-2027-Calendar.jpg" },
      { id: "sep", name: "September 2027", img: "https://raw.githubusercontent.com/zahiruddin0/HTML-3/refs/heads/main/MALAYSIA%20CALENDER%202027/September-2027-Calendar.jpg" },
      { id: "okt", name: "October 2027", img: "https://raw.githubusercontent.com/zahiruddin0/HTML-3/refs/heads/main/MALAYSIA%20CALENDER%202027/October-2027-Calendar.jpg" },
      { id: "nov", name: "November 2027", img: "https://raw.githubusercontent.com/zahiruddin0/HTML-3/refs/heads/main/MALAYSIA%20CALENDER%202027/November-2027-Calendar.jpg" },
      { id: "dis", name: "December 2027", img: "https://raw.githubusercontent.com/zahiruddin0/HTML-3/refs/heads/main/MALAYSIA%20CALENDER%202027/December-2027-Calendar.jpg" }
    ];

    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const liveRegion = document.getElementById('liveRegion');

    function announce(msg) {
      liveRegion.textContent = '';
      requestAnimationFrame(() => { liveRegion.textContent = msg; });
    }

    /* ---------- PRELOAD IMAGES ---------- */
    function preloadImage(src) {
      const img = new Image();
      img.src = src;
    }

    function preloadAdjacent(monthIndex) {
      if (monthIndex > 0) preloadImage(monthsData[monthIndex - 1].img);
      if (monthIndex < monthsData.length - 1) preloadImage(monthsData[monthIndex + 1].img);
    }

    /* ---------- RENDER CALENDAR ---------- */
    const gridContainer = document.getElementById('calendarGrid');

    function renderCalendar() {
      gridContainer.innerHTML = '';
      monthsData.forEach(month => {
        const card = document.createElement('div');
        card.className = 'month-card';
        card.id = month.id;
        card.setAttribute('tabindex', '0');
        card.setAttribute('role', 'button');
        card.setAttribute('aria-label', `Lihat gambar penuh ${month.name}`);

        const titleDiv = document.createElement('div');
        titleDiv.className = 'month-title';
        titleDiv.textContent = month.name;

        const wrapDiv = document.createElement('div');
        wrapDiv.className = 'month-image-wrap';

        const placeholder = document.createElement('div');
        placeholder.className = 'month-image-placeholder';
        placeholder.innerHTML = '<div class="spinner"></div>Memuatkan...';

        const imgElem = document.createElement('img');
        imgElem.src = month.img;
        imgElem.alt = month.name;
        imgElem.className = 'month-image';
        imgElem.loading = 'lazy';
        imgElem.setAttribute('data-full', month.img);

        imgElem.addEventListener('load', () => {
          placeholder.classList.add('hidden');
          imgElem.classList.add('loaded');
        });

        imgElem.addEventListener('error', () => {
          placeholder.innerHTML = 'Gagal memuatkan gambar';
        });

        wrapDiv.appendChild(placeholder);
        wrapDiv.appendChild(imgElem);

        card.appendChild(titleDiv);
        card.appendChild(wrapDiv);
        gridContainer.appendChild(card);
      });
    }
    renderCalendar();

    /* ---------- THEME TOGGLE ---------- */
    const themeBtn = document.getElementById('themeBtn');
    const rootBody = document.body;

    function setTheme(theme) {
      rootBody.setAttribute('data-theme', theme);
      localStorage.setItem('calendar-theme', theme);
      themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
      themeBtn.setAttribute('aria-label', theme === 'dark' ? 'Tukar tema terang' : 'Tukar tema gelap');
    }

    const savedTheme = localStorage.getItem('calendar-theme');
    if (savedTheme && (savedTheme === 'dark' || savedTheme === 'light')) {
      setTheme(savedTheme);
    } else {
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      setTheme(prefersDark ? 'dark' : 'light');
    }

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      if (!localStorage.getItem('calendar-theme')) {
        setTheme(e.matches ? 'dark' : 'light');
      }
    });

    themeBtn.addEventListener('click', () => {
      const current = rootBody.getAttribute('data-theme');
      setTheme(current === 'dark' ? 'light' : 'dark');
    });

    /* ---------- SMOOTH SCROLL NAVIGATION ---------- */
    function getNavHeight() {
      const nav = document.querySelector('.nav-container');
      return nav ? nav.offsetHeight : 0;
    }

    document.querySelectorAll('.month-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const monthId = btn.getAttribute('data-month');
        const targetCard = document.getElementById(monthId);
        if (targetCard) {
          const cardRect = targetCard.getBoundingClientRect();
          const navHeight = getNavHeight();
          const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
          const viewportHeight = window.innerHeight;
          const cardCenter = cardRect.top + scrollTop + cardRect.height / 2;
          const targetScroll = cardCenter - navHeight - (viewportHeight - navHeight) / 2;

          window.scrollTo({
            top: Math.max(0, targetScroll),
            behavior: prefersReducedMotion ? 'auto' : 'smooth'
          });

          targetCard.classList.add('highlight');
          setTimeout(() => targetCard.classList.remove('highlight'), 800);
        }
      });
    });

    /* ---------- SCROLL SPY: ACTIVE MONTH INDICATOR ---------- */
    const monthBtns = document.querySelectorAll('.month-btn');
    let scrollSpyEnabled = true;

    function updateActiveMonth() {
      if (!scrollSpyEnabled) return;
      const navHeight = getNavHeight();
      const viewportMiddle = navHeight + (window.innerHeight - navHeight) / 2;
      let closestCard = null;
      let closestDist = Infinity;

      monthsData.forEach(month => {
        const card = document.getElementById(month.id);
        if (!card) return;
        const rect = card.getBoundingClientRect();
        const cardCenter = rect.top + rect.height / 2;
        const dist = Math.abs(cardCenter - viewportMiddle);
        if (dist < closestDist) {
          closestDist = dist;
          closestCard = month.id;
        }
      });

      if (closestCard) {
        monthBtns.forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-month') === closestCard);
        });
      }
    }

    let scrollSpyTimer;
    window.addEventListener('scroll', () => {
      clearTimeout(scrollSpyTimer);
      scrollSpyTimer = setTimeout(updateActiveMonth, 50);
    }, { passive: true });

    updateActiveMonth();

    /* ---------- SCROLL TO TOP BUTTON ---------- */
    const scrollTopBtn = document.getElementById('scrollTopBtn');

    window.addEventListener('scroll', () => {
      if (window.pageYOffset > 400) {
        scrollTopBtn.classList.add('visible');
      } else {
        scrollTopBtn.classList.remove('visible');
      }
    }, { passive: true });

    scrollTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: prefersReducedMotion ? 'auto' : 'smooth' });
    });

    /* ========== LIGHTBOX + ZOOM + PAN ========== */
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImage');
    const closeModalBtn = document.getElementById('closeModal');
    const modalContainerDiv = document.getElementById('modalContainer');
    const modalLoader = document.getElementById('modalLoader');
    const zoomHint = document.getElementById('zoomHint');
    const modalPrev = document.getElementById('modalPrev');
    const modalNext = document.getElementById('modalNext');
    const modalMonthLabel = document.getElementById('modalMonthLabel');
    const shareBtn = document.getElementById('shareBtn');
    const longpressToast = document.getElementById('longpressToast');

    let scale = 1;
    let translateX = 0, translateY = 0;
    let isDragging = false;
    let startX = 0, startY = 0;
    let currentModalMonthIndex = -1;

    let initialPinchDist = 0;
    let initialScale = 1;
    let initialTransX = 0, initialTransY = 0;
    let pinchCenterX = 0, pinchCenterY = 0;

    /* Swipe tracking */
    let swipeStartX = 0, swipeStartY = 0;
    let swipeStartTime = 0;
    let isSwiping = false;

    /* Swipe down to close tracking */
    let swipeDownStartY = 0;
    let isSwipeDown = false;

    /* Long press tracking */
    let longpressTimer = null;

    function resetImageTransform() {
      scale = 1;
      translateX = 0;
      translateY = 0;
      applyTransform();
    }

    function applyTransform() {
      modalImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
      modalImg.classList.toggle('zoomed', scale > 1);
    }

    function constrainPan() {
      if (!modalImg.naturalWidth || !modalImg.naturalHeight) return;
      const viewW = window.innerWidth;
      const viewH = window.innerHeight;
      const scaledW = modalImg.naturalWidth * scale;
      const scaledH = modalImg.naturalHeight * scale;
      let maxX = Math.max(0, (scaledW - viewW) / 2);
      let maxY = Math.max(0, (scaledH - viewH) / 2);
      if (scaledW <= viewW) maxX = 0;
      if (scaledH <= viewH) maxY = 0;
      translateX = Math.min(maxX, Math.max(-maxX, translateX));
      translateY = Math.min(maxY, Math.max(-maxY, translateY));
    }

    function updateModalNavButtons() {
      modalPrev.classList.toggle('disabled', currentModalMonthIndex <= 0);
      modalNext.classList.toggle('disabled', currentModalMonthIndex >= monthsData.length - 1);
      modalMonthLabel.textContent = monthsData[currentModalMonthIndex].name;
    }

    function navigateModal(newIndex) {
      if (newIndex < 0 || newIndex >= monthsData.length) return;
      resetImageTransform();
      openModal(monthsData[newIndex].img, null, newIndex);
    }

    function openModal(imgSrc, startRect, monthIndex) {
      currentModalMonthIndex = monthIndex;
      resetImageTransform();
      modalLoader.classList.remove('hidden');
      modalImg.style.opacity = '0';
      modalImg.src = imgSrc;
      modalImg.alt = monthsData[monthIndex].name;
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
      updateModalNavButtons();
      preloadAdjacent(monthIndex);

      if (prefersReducedMotion) {
        modalImg.style.transition = 'none';
        modalImg.style.transform = 'translate(0px, 0px) scale(1)';
        modalImg.style.opacity = '1';
        if (modalImg.complete && modalImg.naturalWidth) {
          modalLoader.classList.add('hidden');
        }
        announce(`Gambar penuh ${monthsData[monthIndex].name} dibuka`);
        return;
      }

      modalImg.style.transition = 'transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.2), opacity 0.3s';
      if (startRect) {
        const viewCenterX = window.innerWidth / 2;
        const viewCenterY = window.innerHeight / 2;
        const imgCenterX = startRect.left + startRect.width / 2;
        const imgCenterY = startRect.top + startRect.height / 2;
        const offsetX = imgCenterX - viewCenterX;
        const offsetY = imgCenterY - viewCenterY;
        const startScale = Math.min(0.4, (startRect.width / window.innerWidth) * 0.8);
        modalImg.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${startScale})`;
      } else {
        modalImg.style.transform = 'scale(0.7)';
      }
      modalImg.style.opacity = '0';

      setTimeout(() => {
        modalImg.style.transition = 'transform 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.2), opacity 0.35s';
        modalImg.style.transform = 'translate(0px, 0px) scale(1)';
        modalImg.style.opacity = '1';
        setTimeout(() => {
          scale = 1;
          translateX = 0;
          translateY = 0;
          applyTransform();
          modalImg.style.transition = '';
        }, 580);
      }, 20);

      announce(`Gambar penuh ${monthsData[monthIndex].name} dibuka`);
    }

    function closeModal() {
      if (!modal.classList.contains('active')) return;
      document.body.style.overflow = '';

      if (prefersReducedMotion) {
        modal.classList.remove('active');
        resetImageTransform();
        announce('Gambar ditutup');
        return;
      }

      modalImg.style.transition = 'transform 0.3s ease, opacity 0.25s';
      modalImg.style.transform = 'scale(0.85)';
      modalImg.style.opacity = '0';
      setTimeout(() => {
        modal.classList.remove('active');
        resetImageTransform();
        modalImg.style.transition = '';
        announce('Gambar ditutup');
      }, 280);
    }

    document.addEventListener('click', (e) => {
      const card = e.target.closest('.month-card');
      if (card && !modal.classList.contains('active')) {
        const imgElement = card.querySelector('img');
        if (imgElement) {
          const monthIndex = monthsData.findIndex(m => m.id === card.id);
          const rect = imgElement.getBoundingClientRect();
          openModal(imgElement.getAttribute('data-full') || imgElement.src, rect, monthIndex);
        }
      }
    });

    document.addEventListener('keydown', (e) => {
      const card = e.target.closest('.month-card');
      if (card && (e.key === 'Enter' || e.key === ' ')) {
        e.preventDefault();
        card.click();
      }
    });

    closeModalBtn.addEventListener('click', closeModal);
    modalPrev.addEventListener('click', () => navigateModal(currentModalMonthIndex - 1));
    modalNext.addEventListener('click', () => navigateModal(currentModalMonthIndex + 1));

    modal.addEventListener('click', (e) => {
      if (e.target === modal || e.target === modalContainerDiv) closeModal();
    });

    modalImg.addEventListener('load', () => {
      modalLoader.classList.add('hidden');
    });

    /* ---------- SHARE BUTTON ---------- */
    shareBtn.addEventListener('click', async () => {
      if (currentModalMonthIndex < 0) return;
      const month = monthsData[currentModalMonthIndex];

      if (navigator.share) {
        try {
          const response = await fetch(month.img);
          const blob = await response.blob();
          const file = new File([blob], `${month.id}-2027.jpg`, { type: 'image/jpeg' });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
              title: `Kalendar Malaysia - ${month.name}`,
              text: `Kalendar Malaysia ${month.name}`,
              files: [file]
            });
          } else {
            await navigator.share({
              title: `Kalendar Malaysia - ${month.name}`,
              text: `Kalendar Malaysia ${month.name}`,
              url: month.img
            });
          }
        } catch (err) {
          if (err.name !== 'AbortError') {
            fallbackShare(month);
          }
        }
      } else {
        fallbackShare(month);
      }
    });

    function fallbackShare(month) {
      const url = `https://wa.me/?text=${encodeURIComponent(`Kalendar Malaysia ${month.name}\n${month.img}`)}`;
      window.open(url, '_blank');
    }

    /* ---------- LONG PRESS TO DOWNLOAD ---------- */
    function startLongpress(e) {
      if (scale > 1) return;
      longpressTimer = setTimeout(() => {
        longpressToast.classList.add('show');
        const a = document.createElement('a');
        a.href = modalImg.src;
        a.download = `kalendar-malaysia-${monthsData[currentModalMonthIndex].id}-2027.jpg`;
        a.target = '_blank';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        announce('Gambar dimuat turun');
        setTimeout(() => longpressToast.classList.remove('show'), 2000);
      }, 600);
    }

    function cancelLongpress() {
      clearTimeout(longpressTimer);
      longpressTimer = null;
    }

    modalImg.addEventListener('mousedown', (e) => {
      if (e.button === 0) startLongpress(e);
    });

    modalImg.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1 && scale <= 1) startLongpress(e);
    }, { passive: true });

    modalImg.addEventListener('mouseup', cancelLongpress);
    modalImg.addEventListener('mouseleave', cancelLongpress);
    modalImg.addEventListener('touchend', cancelLongpress);
    modalImg.addEventListener('touchmove', cancelLongpress);

    /* ---------- ZOOM with Wheel ---------- */
    modalContainerDiv.addEventListener('wheel', (e) => {
      if (!modal.classList.contains('active')) return;
      e.preventDefault();
      const delta = e.deltaY > 0 ? 0.92 : 1.08;
      let newScale = scale * delta;
      newScale = Math.min(Math.max(1, newScale), 6);
      if (Math.abs(newScale - scale) < 0.01) return;

      const mouseX = e.clientX;
      const mouseY = e.clientY;
      const rect = modalImg.getBoundingClientRect();
      const ratioX = (mouseX - rect.left) / rect.width;
      const ratioY = (mouseY - rect.top) / rect.height;
      const oldScale = scale;
      scale = newScale;
      const dx = (ratioX - 0.5) * (rect.width * (scale / oldScale - 1));
      const dy = (ratioY - 0.5) * (rect.height * (scale / oldScale - 1));
      translateX += dx;
      translateY += dy;
      constrainPan();
      applyTransform();
    }, { passive: false });

    /* ---------- PAN with Mouse ---------- */
    modalImg.addEventListener('mousedown', (e) => {
      if (!modal.classList.contains('active') || scale <= 1) return;
      e.preventDefault();
      isDragging = true;
      startX = e.clientX - translateX;
      startY = e.clientY - translateY;
      modalImg.style.transition = 'none';
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging || !modal.classList.contains('active')) return;
      e.preventDefault();
      translateX = e.clientX - startX;
      translateY = e.clientY - startY;
      constrainPan();
      applyTransform();
    });

    window.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        modalImg.style.transition = '';
      }
    });

    /* ---------- TOUCH: PAN, PINCH, SWIPE & SWIPE DOWN ---------- */
    modalImg.addEventListener('touchstart', (e) => {
      if (!modal.classList.contains('active')) return;
      if (e.touches.length === 2) {
        e.preventDefault();
        const t1 = e.touches[0], t2 = e.touches[1];
        initialPinchDist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
        initialScale = scale;
        initialTransX = translateX;
        initialTransY = translateY;
        pinchCenterX = (t1.clientX + t2.clientX) / 2;
        pinchCenterY = (t1.clientY + t2.clientY) / 2;
        modalImg.style.transition = 'none';
        isSwiping = false;
        isSwipeDown = false;
      } else if (e.touches.length === 1) {
        const touch = e.touches[0];
        swipeStartX = touch.clientX;
        swipeStartY = touch.clientY;
        swipeDownStartY = touch.clientY;
        swipeStartTime = Date.now();
        isSwiping = true;
        isSwipeDown = true;

        if (scale > 1) {
          e.preventDefault();
          isDragging = true;
          startX = touch.clientX - translateX;
          startY = touch.clientY - translateY;
          modalImg.style.transition = 'none';
        }
      }
    }, { passive: false });

    modalImg.addEventListener('touchmove', (e) => {
      if (!modal.classList.contains('active')) return;
      if (e.touches.length === 2) {
        e.preventDefault();
        isSwiping = false;
        isSwipeDown = false;
        const t1 = e.touches[0], t2 = e.touches[1];
        const currentDist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
        if (initialPinchDist > 0) {
          let newScale = initialScale * (currentDist / initialPinchDist);
          newScale = Math.min(Math.max(1, newScale), 6);
          scale = newScale;
          const cx = (t1.clientX + t2.clientX) / 2;
          const cy = (t1.clientY + t2.clientY) / 2;
          translateX = initialTransX + (cx - pinchCenterX);
          translateY = initialTransY + (cy - pinchCenterY);
          constrainPan();
          applyTransform();
        }
      } else if (e.touches.length === 1) {
        const touch = e.touches[0];
        const dx = Math.abs(touch.clientX - swipeStartX);
        const dy = touch.clientY - swipeStartY;

        if (dx > 10 || dy < -10) {
          isSwipeDown = false;
        }

        if (isDragging && scale > 1) {
          e.preventDefault();
          isSwiping = false;
          translateX = touch.clientX - startX;
          translateY = touch.clientY - startY;
          constrainPan();
          applyTransform();
        }
      }
    }, { passive: false });

    modalImg.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) {
        isDragging = false;
        modalImg.style.transition = '';

        /* Swipe left/right navigation */
        if (isSwiping && scale <= 1) {
          const dx = e.changedTouches[0].clientX - swipeStartX;
          const dy = e.changedTouches[0].clientY - swipeStartY;
          const dt = Date.now() - swipeStartTime;
          const absDx = Math.abs(dx);
          const absDy = Math.abs(dy);

          if (absDx > 60 && absDx > absDy * 1.5 && dt < 500) {
            if (dx < 0 && currentModalMonthIndex < monthsData.length - 1) {
              navigateModal(currentModalMonthIndex + 1);
            } else if (dx > 0 && currentModalMonthIndex > 0) {
              navigateModal(currentModalMonthIndex - 1);
            }
            isSwiping = false;
            isSwipeDown = false;
            return;
          }
        }

        /* Swipe down to close */
        if (isSwipeDown && scale <= 1) {
          const dy = e.changedTouches[0].clientY - swipeDownStartY;
          const dt = Date.now() - swipeStartTime;
          if (dy > 100 && dt < 400) {
            closeModal();
          }
        }

        isSwiping = false;
        isSwipeDown = false;
      }
      if (e.touches.length < 2) {
        initialPinchDist = 0;
      }
    });

    /* ---------- DOUBLE CLICK ZOOM ---------- */
    modalImg.addEventListener('dblclick', (e) => {
      if (!modal.classList.contains('active')) return;
      e.preventDefault();
      if (scale > 1.2) {
        resetImageTransform();
        constrainPan();
        applyTransform();
      } else {
        const rect = modalImg.getBoundingClientRect();
        const ratioX = (e.clientX - rect.left) / rect.width;
        const ratioY = (e.clientY - rect.top) / rect.height;
        const oldScale = scale;
        scale = 2.2;
        translateX += (ratioX - 0.5) * (rect.width * (scale / oldScale - 1));
        translateY += (ratioY - 0.5) * (rect.height * (scale / oldScale - 1));
        constrainPan();
        applyTransform();
      }
    });

    /* ---------- KEYBOARD: ESCAPE & ARROW NAVIGATION ---------- */
    document.addEventListener('keydown', (e) => {
      if (!modal.classList.contains('active')) return;

      if (e.key === 'Escape') {
        e.preventDefault();
        closeModal();
        return;
      }

      if (e.key === 'ArrowRight') {
        e.preventDefault();
        navigateModal(currentModalMonthIndex + 1);
      }

      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        navigateModal(currentModalMonthIndex - 1);
      }
    });

    /* ---------- ZOOM HINT ---------- */
    function updateZoomHint() {
      if ('ontouchstart' in window) {
        zoomHint.textContent = '🔍 Cencung untuk zum | Cengkam untuk pan | Swipe kiri/kanan navigasi | Swipe bawah tutup';
      } else {
        zoomHint.textContent = '🔍 Ctrl + roda tetikus untuk zum | Klik gambar untuk pan | ← → navigasi';
      }
    }
    updateZoomHint();
  </script>
</body>
</html>
